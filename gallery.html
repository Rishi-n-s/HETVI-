<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Memory Gallery | Eternal Scrapbook</title>
<meta name="description" content="Relive your most cherished memories, beautifully captured in our gallery."/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Quicksand:wght@500;600&family=Caveat:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="assets/js/theme.js"></script>
<link rel="stylesheet" href="assets/css/shared.css"/>
<link rel="stylesheet" href="assets/css/transitions.css"/>
<style>
  body { overflow-x: hidden; background-color: #faf9f6; }
  .polaroid-hover { transition: transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275), box-shadow 0.4s ease; }
  .polaroid-hover:hover { transform: translateY(-8px) scale(1.02) !important; box-shadow: 20px 20px 40px rgba(74,55,40,0.15) !important; z-index: 50; }
  .washi-tape {
    background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(255, 255, 255, 0.2) 5px, rgba(255, 255, 255, 0.2) 10px);
  }
  
  /* Entrance Animation */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(60px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .animate-fade-up {
    animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) backwards;
  }

  /* Gentle Floating Animation */
  @keyframes gentleFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  .animate-float {
    animation: gentleFloat 6s ease-in-out infinite;
  }
</style>
</head>
<body class="bg-background text-on-surface font-body-main">

<!-- Background -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
  <div class="absolute inset-0 bg-cover bg-center opacity-40 scale-105" style="background-image:url('https://lh3.googleusercontent.com/aida-public/AB6AXuDBm-E1ym0M2GzHooAWb5h8l453TronsIOtuzmAhFuKfIXX2xcPVz5MX1bwj2iD7cLIy5UNmZEOvpkwM1vanzAMG448gtczHA7_nKbSerHp-scbtg23KiSayZ_j8jwGcb5R0pIvfh7x_82FYkjCrzZop95u2ANYPyZMwaJIkbxJrjrukkQEpXN0FvcUV5zWrhEb1YwpBjhQh3bpRzfsquN9uTg_Hwrn6fMPXqYhUQjHI4R8Dg5xyZ5c')"></div>
</div>

<!-- Top AppBar -->
<header class="fixed top-0 left-0 w-full z-40 bg-white/60 backdrop-blur-md border-b border-surface-variant/30">
  <div class="flex justify-between items-center w-full py-4 px-10">
    <span class="font-subtitle-serif text-subtitle-serif italic text-primary">Eternal Scrapbook</span>
    <div class="flex items-center gap-6">
      <a href="music.html" class="text-primary hover:opacity-80"><span class="material-symbols-outlined">music_note</span></a>
      <a href="settings.html" class="text-primary hover:opacity-80"><span class="material-symbols-outlined">palette</span></a>
    </div>
  </div>
</header>

<!-- Main -->
<main class="relative z-10 pt-28 pb-40 px-6 md:px-10 min-h-screen w-full max-w-7xl mx-auto">
  <div class="mb-14 text-center">
    <h1 class="font-headline-xl text-[64px] text-primary drop-shadow-sm mb-4 mt-6" style="font-family:'Playfair Display',serif;font-style:italic;">All Her Memories</h1>
    <p class="font-handwritten text-3xl text-on-surface-variant/80 max-w-xl mx-auto">A thousand little moments, beautifully captured.</p>
  </div>

  <!-- Dynamic Gallery Grid -->
  <div id="gallery-grid" class="columns-2 md:columns-3 lg:columns-4 gap-10 md:gap-14 space-y-14 md:space-y-20 w-full pb-32">
    <!-- Media will be injected here by JavaScript -->
  </div>
</main>

<script src="assets/js/media-data.js"></script>
<script>
  // Populate the masonry grid with all 133 images/videos, styled as Polaroids
  const grid = document.getElementById('gallery-grid');
  
  // Washi tape colors to randomize
  const tapeColors = ['bg-primary-container/80', 'bg-secondary-container/80', 'bg-tertiary-container/80', 'bg-[#ffb7c5]/80', 'bg-[#baeaff]/80', 'bg-[#e2c6ff]/80'];
  
  // Descriptive captions to randomize
  const captions = ['Beautiful smile', 'Quiet moments', 'Sun-kissed', 'A day to remember', 'Lost in thoughts', 'Laughing out loud', 'Serenity', 'Perfect day', 'Memories', 'Just chilling', 'Golden hour', 'So precious'];

  if (typeof mediaFiles !== 'undefined' && mediaFiles.length > 0) {
    mediaFiles.forEach((file, index) => {
      const isVideo = file.toLowerCase().endsWith('.mp4');
      const srcPath = encodeURI(`./assets/images/images of her/${file}`);
      
      // Randomize polaroid styling to make them look messy and unaligned
      const randomRot = (Math.random() * 14) - 7; // -7 to 7 degrees
      const randomX = (Math.random() * 80) - 40; // -40px to 40px shift horizontally
      const randomY = (Math.random() * 80) - 40; // -40px to 40px shift vertically
      
      const randomTapeRot = (Math.random() * 16) - 8; // -8 to 8 degrees
      const tapeColor = tapeColors[index % tapeColors.length];
      const caption = captions[Math.floor(Math.random() * captions.length)];
      
      // Animation timing
      const entranceDelay = (index % 12) * 0.1; // Staggered entrance
      const floatDelay = Math.random() * -6; // Negative delay so they don't start in sync
      const floatDuration = 5 + (Math.random() * 3); // 5s to 8s loop
      
      const itemDiv = document.createElement('div');
      itemDiv.className = `break-inside-avoid w-full relative polaroid-hover group cursor-pointer mb-16 animate-fade-up`;
      itemDiv.style.animationDelay = `${entranceDelay}s`;
      
      // We wrap the transform in another div so the float animation doesn't fight the hover transform
      let mediaHtml = isVideo ? 
        `<video class="w-full min-h-[350px] aspect-[4/5] object-cover group-hover:scale-[1.03] transition-transform duration-700 bg-black/10" controls playsinline>
          <source src="${srcPath}" type="video/mp4">
          Your browser does not support videos.
        </video>` : 
        `<img class="w-full aspect-[4/5] object-cover group-hover:scale-[1.03] transition-transform duration-700" loading="lazy" src="${srcPath}" alt="Memory">`;
        
      itemDiv.innerHTML = `
        <div class="animate-float" style="animation-delay: ${floatDelay}s; animation-duration: ${floatDuration}s">
          <div class="bg-surface-container-lowest p-3 pb-4 shadow-[10px_10px_20px_rgba(0,0,0,0.06)] border border-surface-variant/40 relative" style="transform: translate(${randomX}px, ${randomY}px) rotate(${randomRot}deg)">
            <!-- Washi tape -->
            <div class="absolute -top-3 left-1/2 -translate-x-1/2 w-16 h-6 ${tapeColor} washi-tape z-20 shadow-sm" style="transform: translateX(-50%) rotate(${randomTapeRot}deg)"></div>
            
            <!-- Image Container -->
            <div class="w-full overflow-hidden bg-surface-container-high shadow-inner relative">
              ${mediaHtml}
            </div>
            
            <!-- Polaroid Caption area -->
            <div class="mt-4 flex justify-between items-center px-1">
               <span class="material-symbols-outlined text-primary/40 text-sm">favorite</span>
               <p class="font-handwritten text-2xl text-center text-on-surface-variant flex-1 px-2 line-clamp-1">${caption}</p>
               <span class="material-symbols-outlined text-outline/40 text-sm rotate-45">push_pin</span>
            </div>
          </div>
        </div>
      `;
      
      grid.appendChild(itemDiv);
    });
  } else {
    grid.innerHTML = '<p class="text-center w-full col-span-full font-handwritten text-3xl">No media found.</p>';
  }
</script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/sounds.js"></script>

<!-- Flower Transition Overlay HTML -->
<div id="flower-transition">
  <svg class="flower-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 50 C50 20 80 20 50 50 C80 80 50 80 50 50 C50 80 20 80 50 50 C20 20 50 20 50 50" fill="white" stroke="#ffb7c5" stroke-width="2"/>
    <circle cx="50" cy="50" r="8" fill="#ffd700"/>
  </svg>
</div>

<script>
  // Handle Flower Transition
  document.querySelectorAll('a[href]').forEach(link => {
    link.addEventListener('click', function(e) {
      // Only apply to internal links
      const target = this.getAttribute('href');
      if (target && !target.startsWith('http') && !target.startsWith('#')) {
        e.preventDefault();
        const transition = document.getElementById('flower-transition');
        transition.classList.add('active');
        
        // Navigate after animation
        setTimeout(() => {
          window.location.href = target;
        }, 800);
      }
    });
  });
  
  // Fade out transition on load
  window.addEventListener('pageshow', () => {
    const transition = document.getElementById('flower-transition');
    if (transition.classList.contains('active')) {
      transition.classList.remove('active');
    }
  });
</script>
</body>
</html>
