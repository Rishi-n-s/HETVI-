  body { overflow-x: hidden; background-color: #faf9f6; }
  .paper-letter { background-image: url("https://www.transparenttextures.com/patterns/notebook.png"); background-color: #fffdf8; }
  .lined { background-image: linear-gradient(rgba(255,143,163,0.15) 1px, transparent 1px); background-size: 100% 2.5rem; }
  
  .letter-hover { transition: transform 0.5s cubic-bezier(0.175,0.885,0.32,1.275), box-shadow 0.5s ease; }
  .letter-hover:hover { transform: translateY(-8px) scale(1.02) !important; box-shadow: 20px 20px 40px rgba(74,55,40,0.15) !important; z-index: 50; }
  
  .washi-tape {
    background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(255, 255, 255, 0.2) 5px, rgba(255, 255, 255, 0.2) 10px);
  }
  
  /* Staggered entrance animation for letters */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(40px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .animate-fade-up {
    animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) backwards;
  }
  
  /* Party Popper Animation for 100 Languages */
  @keyframes partyPop {
    0% {
      opacity: 0;
      transform: translate(var(--popX), var(--popY)) scale(0.2) rotate(var(--popRot));
    }
    60% {
      opacity: 1;
      transform: translate(calc(var(--popX) * 0.5), calc(var(--popY) * 0.5)) scale(1.1) rotate(calc(var(--popRot) * 0.5));
    }
    100% {
      opacity: 1;
      transform: translate(0, 0) scale(1) rotate(0deg);
    }
  }
  .animate-party-pop {
    animation: partyPop 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }

  if (typeof lettersData !== 'undefined' && lettersData.length > 0) {
    const shuffledLetters = [...lettersData].sort(() => 0.5 - Math.random());
    
    shuffledLetters.forEach((letter, index) => {
      const randomRot = (Math.random() * 6) - 3; 
      const randomTapeRot = (Math.random() * 16) - 8;
      const tapeColor = tapeColors[index % tapeColors.length];
      const entranceDelay = (index % 15) * 0.1;
      
      const itemDiv = document.createElement('div');
      itemDiv.className = `break-inside-avoid w-full relative letter-hover group cursor-pointer mb-10 animate-fade-up`;
      itemDiv.style.animationDelay = `${entranceDelay}s`;
      itemDiv.style.transform = `rotate(${randomRot}deg)`;
      
      itemDiv.innerHTML = `
        <div class="relative paper-letter lined p-8 pt-10 shadow-[20px_20px_40px_rgba(74,55,40,0.08)] border border-outline-variant/30 h-full" onclick="openLetter(this)">
          <div class="absolute -top-3 left-1/2 -translate-x-1/2 w-20 h-6 ${tapeColor} washi-tape z-20 shadow-sm" style="transform: translateX(-50%) rotate(${randomTapeRot}deg)"></div>
          <div class="flex justify-between items-start mb-4">
            <p class="font-label-caps text-primary/60 tracking-widest">${letter.greeting}</p>
            <span class="font-label-caps text-on-surface-variant/40 text-[10px] bg-white/50 px-2 py-1 rounded-sm">${letter.language.toUpperCase()}</span>
          </div>
          <p class="font-handwritten text-[28px] text-on-surface leading-snug mb-8">${letter.content}</p>
          <div class="flex justify-between items-end mt-auto pt-4 border-t border-primary/10">
            <span class="font-label-caps text-on-surface-variant/50 text-[10px]">${letter.date}</span>
            <span class="material-symbols-outlined text-primary/60" style="font-variation-settings:'FILL' 1">favorite</span>
          </div>
        </div>
      `;
      grid.appendChild(itemDiv);
    });
  } else {
    grid.innerHTML = '<p class="text-center w-full col-span-full font-handwritten text-3xl">No letters found.</p>';
  }

    el.style.boxShadow = '30px 30px 60px rgba(74,55,40,0.15)';

  function revealLanguages() {
    const btn = document.getElementById('magic-btn');
    const container = document.getElementById('languages-container');
    
    // Hide button and show container
    btn.style.display = 'none';
    container.style.display = 'flex';
    
    // Render each phrase as a beautiful badge with staggered explosion animation
    hundredLanguages.forEach((phrase, i) => {
      const badge = document.createElement('div');
      
      // Generate explosion coordinates
      const popX = (Math.random() - 0.5) * 800; // Shoot out up to 400px horizontally
      const popY = (Math.random() - 1.0) * 800; // Shoot out mostly upwards
      const popRot = (Math.random() - 0.5) * 720; // Spin wildly
      
      badge.style.setProperty('--popX', `${popX}px`);
      badge.style.setProperty('--popY', `${popY}px`);
      badge.style.setProperty('--popRot', `${popRot}deg`);
      
      badge.className = 'bg-white/95 backdrop-blur-sm border border-primary/40 text-primary font-handwritten text-[28px] leading-none px-6 py-3 rounded-full shadow-[0_5px_15px_rgba(209,36,80,0.15)] animate-party-pop opacity-0 z-50';
      badge.style.animationDelay = `${i * 0.02}s`; // Faster stagger for explosion effect
      badge.style.animationFillMode = 'forwards';
      badge.textContent = phrase;
      container.appendChild(badge);
    });
    
    // Auto scroll down slowly as they generate
    setTimeout(() => {
      window.scrollBy({ top: 500, behavior: 'smooth' });
    }, 500);
